# Ver: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
# Evita fallos de packageDebug con output-metadata.json (Gradle 9 + buildDir Flutter).
org.gradle.caching=false
org.gradle.configuration-cache=false

